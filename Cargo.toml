[package]
name = "zcode-fresh-reset"
version = "0.3.0"
edition = "2021"
description = "Reset and back up local ZCode state on Windows"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
