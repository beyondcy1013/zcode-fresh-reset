[package]
name = "zcode-fresh-reset"
version = "0.4.0"
edition = "2021"
description = "GUI account backup, switching, and local state management for ZCode on Windows"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
