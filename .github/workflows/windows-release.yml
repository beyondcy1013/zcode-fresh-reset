name: windows-release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Write update manifest
        shell: pwsh
        run: |
          $version = (Get-Content Cargo.toml | Select-String '^version').ToString().Split('"')[1]
          $asset = "zcode-account-manager-$version.exe"
          Copy-Item target/release/zcode-account-manager.exe $asset
          $sha256 = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          @{ version = $version; url = "https://github.com/${{ github.repository }}/releases/download/v$version/$asset"; sha256 = $sha256 } | ConvertTo-Json | Out-File update-manifest.json -Encoding utf8
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            zcode-account-manager-*.exe
            update-manifest.json
            docs/zcode-claim-after-reset.png
      - uses: actions/upload-artifact@v4
        with:
          name: zcode-account-manager-windows-x86_64
          path: zcode-account-manager-*.exe
